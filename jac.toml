[project]
name = "neurotech_"
version = "0.1.0"
description = "A full-stack Jac application"
entry-point = "main.jac"
kind = "web-app"
jac-version = ">=0.16.7,<0.17.0"

[jac-shadcn]
style = "nova"
baseColor = "zinc"
theme = "orange"
font = "figtree"
radius = "large"
menuAccent = "subtle"
menuColor = "default"

[dependencies]
[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
react-hook-form = "^7.71.0"
"@hookform/resolvers" = "^5.2.2"
zod = "^4.3.6"
radix-ui = "*"
class-variance-authority = "*"
"@fontsource-variable/figtree" = "*"
shadcn = "^3.8.5"
"@tailwindcss/vite" = "^4.1.17"
tailwindcss = "^4.1.17"
clsx = "^2.1.1"
tailwind-merge = "^3.5.0"
tw-animate-css = "^1.4.0"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "4.7.0"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"

[dev-dependencies]
watchdog = ">=3.0.0"

# Serve the client at `/` rather than `/cl/app`.
[serve]
base_route_app = "app"

[plugins.scale.microservices]
enabled = false

[client]

[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[client.app_meta_data]
title = "neurotech_"
description = "Reinforce a behavioral intention before and during the experiences that matter."
theme_color = "#000000"
