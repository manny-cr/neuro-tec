name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned to the toolchain version in jac.toml (>=0.16.7,<0.35.0). Bump
      # both together. The installer drops the self-contained `jac` binary in
      # ~/.local/bin.
      - name: Install Jac
        run: |
          curl -fsSL https://raw.githubusercontent.com/jaseci-labs/jaseci/main/scripts/install.sh \
            | bash -s -- --version 0.34.7
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Jac version
        run: jac --version

      - name: Type-check
        run: jac check main.jac

      # Start from a clean graph so no stale persisted root leaks between the
      # checkout and the run (see endpoints.test.jac).
      - name: Test
        run: |
          jac clean --all --force || true
          jac test endpoints.jac
